[package]
name = "japalitysplice"
version = "1.0.0"
edition = "2021"
description = "A sparse k-mer RNA-Seq splice-aware aligner for edge-oriented computing"
license = "GPL-3.0-or-later"
authors = ["Yi Hao Chen <info@japality.com>", "Kota Kojima"]
repository = "https://github.com/japality/japalitysplice"

[[bin]]
name = "japalitysplice"
path = "src/bin/japalitysplice.rs"

[lib]
name = "japalitysplice_core"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1.0"
rustc-hash = "1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
